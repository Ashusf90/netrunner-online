name: Claude Code

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */4 * * *"
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  arasaka:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@arasaka')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@arasaka')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@arasaka')) ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@arasaka') || contains(github.event.issue.title, '@arasaka'))) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'arasaka:ready') ||
        github.event_name == 'pull_request'
      )
    uses: mzpkdev/preemclaud/.github/workflows/arasaka.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
      id-token: write
      actions: write
    with:
      trigger_phrase: "@arasaka"
      ready_label: "arasaka:ready"
      queue_max_issues: "1"
      auto_start_from_queue: true
    secrets: inherit
