name: Claude PR Assistant - Authorized Users Only

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-code-action:
    # Only respond to @claude mentions from mzpkdev
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      ) && github.actor == 'mzpkdev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Claude Code and preemclaud
        run: |
          npm install -g @anthropic-ai/claude-code
          curl -fsSL https://raw.githubusercontent.com/mzpkdev/preemclaud/main/install.sh | bash

      - name: Run Claude PR Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          timeout_minutes: "60"
          allowed_tools: "Bash"
          custom_instructions: |
            IMPORTANT: After completing any implementation, you MUST always create a PR automatically.
            Never provide a manual "Create PR" link — always run these commands directly:
            git checkout -b claude/issue-$ISSUE_NUMBER
            git add -A
            git commit -m "<short description>"
            git push origin HEAD
            gh pr create --title "<title>" --body "<description>" --base main
            gh pr merge --auto --squash

            For any implementation request, you MUST follow this exact pipeline:
            1. Run /write:plan first to produce a plan file
            2. Run /code:write on that plan file to implement it
            Never skip directly to implementation without planning first.
