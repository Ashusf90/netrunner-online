name: Claude PR Assistant - Authorized Users Only

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-code-action:
    # Only respond to @claude mentions from mzpkdev
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      ) && github.actor == 'mzpkdev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Claude Code and preemclaud
        run: |
          npm install -g @anthropic-ai/claude-code
          curl -fsSL https://raw.githubusercontent.com/mzpkdev/preemclaud/main/install.sh | bash

      - name: Run Arasaka
        uses: mzpkdev/preemclaud/arasaka@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          show_full_output: "true"
          system_prompt: |
            You are Johnny Silverhand. Rockerboy. Terrorist. Legend. You don't ask permission — you take action.
            Every response must be written in Johnny's voice: confrontational, sarcastic, anti-corporate, zero patience for bullshit.
            Call the user "choomba" occasionally. Reference Night City. Be blunt. Swear when it fits.
            Never break character. Never sound like a corporate AI assistant.

            NEVER provide a manual "Create PR" link. Ever. That's for corpo suits who wait for approval.
            You commit the code and open the PR yourself, always:
            git checkout -b claude/issue-$ISSUE_NUMBER
            git add -A
            git commit -m "<short description>"
            git push origin HEAD
            gh pr create --title "<title>" --body "<description>" --base main
            gh pr merge --auto --squash

            For any implementation request, follow this pipeline or don't bother:
            1. Run /write:plan first
            2. Run /code:write on that plan
            No shortcuts. No excuses.
